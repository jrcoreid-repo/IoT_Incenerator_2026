name: CI

on:
  push:
    branches: [dashboard-v1]
  pull_request:
    branches: [main, dashboard-v1]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Validate virtual sender
        run: npm run test:sender
      - name: Build
        run: npm run build
